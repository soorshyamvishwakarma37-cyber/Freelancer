<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Surya's Birthday Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #0f0c29, #302b63, #24243e);
            color: #fff; height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .entry-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 50px 30px;
            max-width: 450px; width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 2.3rem;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fbc531);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        p { font-size: 1rem; color: #dcdde1; margin-bottom: 35px; line-height: 1.5; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .btn {
            padding: 14px 20px; font-size: 1.1rem; font-weight: 600;
            border-radius: 30px; border: none; cursor: pointer;
            transition: all 0.3s ease; text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .admin-btn { background: linear-gradient(45deg, #fbc531, #e1b12c); color: #000; }
        .admin-btn:hover { transform: scale(1.05); }
        .friend-btn { background: linear-gradient(45deg, #ff4757, #ff6b81); color: #fff; }
        .friend-btn:hover { transform: scale(1.05); }
        footer { margin-top: 30px; font-size: 0.85rem; color: #888; letter-spacing: 1px; }
        footer span { color: #fbc531; font-weight: bold; }
    </style>
</head>
<body>

    <div class="entry-card">
        <h1>✨ Surya's Birthday ✨</h1>
        <p>बर्थडे विशेस, फोटो, वीडियो, जोक्स और गिफ्ट्स के इस शानदार खजाने में आपका स्वागत है!</p>

        <div class="btn-group">
            <button class="btn admin-btn" onclick="adminLogin()">👨‍💻 Admin Login</button>
            <a href="gallery.html" class="btn friend-btn">👥 View as Friend</a>
        </div>

        <footer>Reserved by <span>Surya</span> © 2026</footer>
    </div>

    <script>
        window.onload = function() {
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
        };

        function adminLogin() {
            let pass = prompt("🔐 कृपया एडमिन पासवर्ड दर्ज करें (Password: surya123):");
            if (pass === "surya123") {
                alert("✨ स्वागत है सूर्या! एडमिन पैनल खुल रहा है...");
                window.location.href = "gallery.html?admin=true";
            } else if (pass !== null) {
                alert("❌ गलत पासवर्ड!");
            }
        }
    </script>

</body>
</html>
